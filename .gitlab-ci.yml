image: node:22-alpine

variables:
  NODE_VERSION: "22.17.0"

default:
  tags:
    # Temporary: replace when an authorised FIT3170 runner is available.
    - fit2107
  interruptible: true
  before_script:
    - . .gitlab/ci/setup-node.sh
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .npm/
      - .node/

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

stages:
  - quality
  - test
  - build

backend_lint:
  stage: quality
  script:
    - cd backend
    - npm ci --cache ../.npm --prefer-offline
    - npm run lint

frontend_lint:
  stage: quality
  script:
    - cd frontend
    - npm ci --cache ../.npm --prefer-offline
    - npm run lint

backend_unit_test:
  stage: test
  script:
    - cd backend
    - npm ci --cache ../.npm --prefer-offline
    - npm run test:unit
  needs:
    - backend_lint

frontend_build:
  stage: build
  script:
    - cd frontend
    - npm ci --cache ../.npm --prefer-offline
    - npm run build
  needs:
    - frontend_lint
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 7 days
