services:
  backend:
    build: ./backend
    volumes:
      - ./backend:/app 
      - /app/node_modules
    ports:
      - "5001:5001"
    networks:
      - app_network
    environment:
      MONGODB_URI: mongodb://mongodb:27017/VolunteerConnect
    env_file:
      - ./backend/.env
    depends_on:
      - mongodb

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app         
      - /app/node_modules
    networks:
      - app_network
    environment:
      VITE_API_URI: http://localhost:5001

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    networks:
      - app_network
    volumes:
      - mongo-data:/data/db

networks:
  app_network:
    driver: bridge

volumes:
  mongo-data:
    driver: local # persist mongodb data locally

