services:
  backend:
    build: ./backend
    volumes:
      - ./backend/src:/app/src
      - ./backend/public:/app/public
    ports:
      - "5001:5001"
    networks:
      - app_network
    environment:
      MONGODB_URI: mongodb://mongodb:27017/VolunteerConnect
    env_file:
      - ./backend/.env
    depends_on:
      mongodb:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    networks:
      - app_network
    environment:
      VITE_API_URI: http://localhost:5001

  mongodb:
    image: mongo:8.0
    ports:
      - "127.0.0.1:27017:27017"
    networks:
      - app_network
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' localhost:27017/test | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  app_network:
    driver: bridge

volumes:
  mongo-data:
    driver: local # persist mongodb data locally

